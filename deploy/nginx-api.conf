# Nginx untuk BACKEND Umira AI (mis. api.umira.id → 127.0.0.1:4000)
# Dipasang oleh scripts/setup-ubuntu.sh. HTTPS: sudo certbot --nginx -d <domain>
limit_req_zone $binary_remote_addr zone=umira_auth:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff always;

  # Chat streaming (SSE): tanpa buffering, timeout panjang (agent bisa lama memakai tool)
  location ~ ^/api/v1/chat/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location ~ ^/api/v1/auth/(login|register|forgot-password) {
    limit_req zone=umira_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Metrics Prometheus hanya untuk internal
  location /metrics { deny all; }
}
